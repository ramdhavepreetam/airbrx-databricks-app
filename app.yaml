command: ["streamlit", "run", "src/streamlit_app.py", "--server.port", "8000", "--server.address", "0.0.0.0"]

env:
  - name: DATABRICKS_WAREHOUSE_ID
    value: "771ee5c628aafe42"
  - name: AIRBRX_STATE_CATALOG
    value: "airbrx_app"
  - name: AIRBRX_STATE_SCHEMA
    value: "state"
  - name: AIRBRX_BILLING_VIEW
    value: "airbrx_app.state.billing_usage_v"
  - name: DBU_RATE_USD
    value: "0.70"
  - name: AIRBRX_SECRET_SCOPE
    value: "airbrx-secrets"
  - name: AIRBRX_SECRET_KEY
    value: "api-key"
  - name: AIRBRX_API_URL
    value: "https://api.airbrx.ai"

resources:
  - name: "sql-warehouse"
    description: "SQL warehouse for running analysis queries"
    sql_warehouse:
      id: "771ee5c628aafe42"
      permission: "CAN_USE"
  - name: "airbrx-api-key"
    description: "Airbrx API key"
    secret:
      scope: "airbrx-secrets"
      key: "api-key"
      permission: "READ"
